'imageBox').classList.add('hide')}$('count').textContent=(pos+1)+' من '+data.length;$('bar').style.width=((pos+1)/data.length*100)+'%';$('jump').value=order[pos];localStorage.setItem('drive133pos',pos);scrollTo({top:0,behavior:'smooth'})}$('reveal').onclick=()=>{$('answer').classList.add('show');$('reveal').style.display='none'};$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('jump').onchange=e=>{pos=order.indexOf(+e.target.value);render()};$('shuffle').onclick=()=>{for(let i=order.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render()};render();</script></body></html>

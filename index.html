let mode=20, quiz=[], idx=0, answers=[], locked=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
$$('.mode button').forEach(b=>b.onclick=()=>{$$('.mode button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=+b.dataset.n;});
$('#startBtn').onclick=()=>{let copy=[...ALL]; for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];} quiz=mode===133?ALL:copy.slice(0,mode); idx=0;answers=[];showQuiz();render();};
function showQuiz(){$('#start').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');$('.top').classList.remove('hidden');$('.bottom').classList.remove('hidden')}
function render(){locked=false;const q=quiz[idx];$('#counter').textContent=`السؤال ${idx+1} من ${quiz.length}`;$('#bar').style.width=((idx)/quiz.length*100)+'%';$('#qnum').textContent='رقم '+q.id;$('#question').textContent=q.question;const ib=$('#imagebox');if(q.image){ib.classList.add('show');$('#qimg').src=q.image}else{ib.classList.remove('show');$('#qimg').removeAttribute('src')};const box=$('#options');box.innerHTML='';q.options.forEach((o,k)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${['أ','ب','ج','د'][k]}</span><span>${escapeHtml(o)}</span>`;b.onclick=()=>choose(b,o,q.answer);box.appendChild(b)});$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').disabled=true;$('#prev').disabled=idx===0;$('#next').textContent=idx===quiz.length-1?'عرض النتيجة':'التالي';window.scrollTo({top:0,behavior:'smooth'})}
function choose(btn,val,ans){if(locked)return;locked=true;let ok=val===ans;answers[idx]={id:quiz[idx].id,q:quiz[idx].question,chosen:val,correct:ans,ok};$$('.option').forEach(b=>{let t=b.querySelector('span:last-child').textContent;if(t===ans)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});let f=$('#feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=ok?'✓ إجابة صحيحة':`✕ إجابة غير صحيحة<div class="answerline">الإجابة الصحيحة: ${escapeHtml(ans)}</div>`;$('#next').disabled=false;$('#bar').style.width=((idx+1)/quiz.length*100)+'%';}
$('#next').onclick=()=>{if(idx<quiz.length-1){idx++;render()}else finish()};$('#prev').onclick=()=>{if(idx>0){idx--;render(); if(answers[idx]){/* intentionally require re-answer */}}};
function finish(){$('#quiz').classList.add('hidden');$('.top').classList.add('hidden');$('.bottom').classList.add('hidden');$('#result').classList.remove('hidden');let correct=answers.filter(a=>a&&a.ok).length;let total=quiz.length;let pct=Math.round(correct/total*100);$('#score').textContent=pct+'%';$('#sCorrect').textContent=correct;$('#sWrong').textContent=total-correct;$('#sTotal').textContent=total;let rev=$('#review');rev.innerHTML='';answers.filter(a=>a&&!a.ok).forEach(a=>{let d=document.createElement('div');d.className='reviewitem';d.innerHTML=`<strong>سؤال ${a.id}:</strong> ${escapeHtml(a.q)}<br><span style="color:#9f2d2d">إجابتك: ${escapeHtml(a.chosen)}</span><br><span style="color:#087553">الصحيح: ${escapeHtml(a.correct)}</span>`;rev.appendChild(d)});if(!rev.children.length)rev.innerHTML='<div class="reviewitem">ممتاز! لا توجد إجابات خاطئة.</div>';window.scrollTo(0,0)}
$('#restart').onclick=()=>location.reload();
function escapeHtml(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
</script></body></html>
